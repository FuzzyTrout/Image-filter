<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filtro — Image Filter Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --surface: #17171a;
    --surface2: #1f1f24;
    --border: rgba(255,255,255,0.07);
    --border-bright: rgba(255,255,255,0.15);
    --text: #e8e8ec;
    --muted: #6b6b78;
    --accent: #c8f542;
    --accent-dim: rgba(200,245,66,0.12);
    --danger: #ff5e5e;
    --radius: 12px;
    --mono: 'DM Mono', monospace;
    --sans: 'Sora', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* Header */
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .logo-tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
  }

  /* Main layout */
  main {
    display: grid;
    grid-template-columns: 280px 1fr;
    overflow: hidden;
  }

  /* Sidebar */
  aside {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .sidebar-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  /* Upload zone */
  .upload-zone {
    border: 1.5px dashed var(--border-bright);
    border-radius: var(--radius);
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-icon {
    font-size: 28px;
    margin-bottom: 8px;
    display: block;
  }

  .upload-text {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  .upload-text strong {
    color: var(--accent);
    font-weight: 600;
  }

  /* Filter list */
  .filter-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .filter-btn {
    background: none;
    border: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.15s;
  }

  .filter-btn:hover {
    background: var(--surface2);
  }

  .filter-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
  }

  .filter-btn .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border-bright);
    flex-shrink: 0;
    transition: background 0.15s;
  }

  .filter-btn.active .dot {
    background: var(--accent);
  }

  /* Apply button */
  .apply-btn {
    margin: 20px;
    background: var(--accent);
    color: #0d0d0f;
    border: none;
    border-radius: var(--radius);
    padding: 13px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    width: calc(100% - 40px);
  }

  .apply-btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }

  .apply-btn:active {
    transform: translateY(0);
  }

  .apply-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
  }

  /* Canvas area */
  .canvas-area {
    display: flex;
    flex-direction: column;
    padding: 28px;
    gap: 20px;
    overflow-y: auto;
  }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
  }

  .empty-state .big-icon {
    font-size: 56px;
    opacity: 0.3;
  }

  .empty-state p {
    font-size: 14px;
  }

  /* Image comparison */
  .comparison {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    display: none;
  }

  .comparison.visible { display: grid; }

  .img-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .img-card-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .img-card-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.8px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .img-card img {
    width: 100%;
    display: block;
    object-fit: contain;
    max-height: 460px;
    background: #0a0a0c;
  }

  .download-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s;
  }

  .download-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Filter tag */
  .filter-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-dim);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid rgba(200,245,66,0.2);
  }

  /* Loading spinner */
  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(13,13,15,0.3);
    border-top-color: #0d0d0f;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .apply-btn.loading .spinner { display: inline-block; }
  .apply-btn.loading .btn-text { display: none; }

  /* Error message */
  .error-msg {
    background: rgba(255,94,94,0.1);
    border: 1px solid rgba(255,94,94,0.3);
    color: var(--danger);
    font-size: 13px;
    padding: 12px 16px;
    border-radius: 8px;
    display: none;
  }

  .error-msg.visible { display: block; }

  /* Info bar */
  .info-bar {
    display: none;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .info-bar.visible { display: flex; }

  .info-item {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  /* Footer */
  footer {
    padding: 12px 32px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <span class="logo">filtro/</span>
  <span class="logo-tag">image filter studio</span>
</header>

<main>
  <aside>
    <div class="sidebar-section">
      <div class="sidebar-label">Upload</div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*">
        <span class="upload-icon">⬆</span>
        <div class="upload-text">
          <strong>Choose a file</strong><br>
          or drag &amp; drop here<br>
          <span style="font-size:11px">JPG, PNG, WEBP up to 16MB</span>
        </div>
      </div>
    </div>

    <div class="sidebar-section" style="flex:1">
      <div class="sidebar-label">Filters</div>
      <div class="filter-list">
        {% for key, (label, _) in filters.items() %}
        <button class="filter-btn {% if loop.first %}active{% endif %}"
                data-filter="{{ key }}"
                onclick="selectFilter(this, '{{ key }}')">
          <span class="dot"></span>
          {{ label }}
        </button>
        {% endfor %}
      </div>
    </div>

    <button class="apply-btn" id="applyBtn" onclick="applyFilter()" disabled>
      <span class="btn-text">Apply filter</span>
      <span class="spinner"></span>
    </button>
  </aside>

  <div class="canvas-area">
    <div class="empty-state" id="emptyState">
      <span class="big-icon">🖼</span>
      <p>Upload an image to get started</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="info-bar" id="infoBar">
      <span class="info-item" id="fileInfo"></span>
      <span class="filter-tag" id="filterTag">
        <span>◆</span>
        <span id="filterTagName">Grayscale</span>
      </span>
    </div>

    <div class="comparison" id="comparison">
      <div class="img-card">
        <div class="img-card-header">
          <span class="img-card-label">Original</span>
        </div>
        <img id="originalImg" src="" alt="Original image">
      </div>
      <div class="img-card">
        <div class="img-card-header">
          <span class="img-card-label">Filtered</span>
          <a class="download-btn" id="downloadBtn" href="#" download="filtered.jpg">↓ Save</a>
        </div>
        <img id="filteredImg" src="" alt="Filtered image">
      </div>
    </div>
  </div>
</main>

<footer>filtro/ — image filter studio &nbsp;·&nbsp; 10 filters available</footer>

<script>
let selectedFilter = '{{ filters.keys()|list|first }}';
let currentFile = null;

const fileInput = document.getElementById('fileInput');
const applyBtn = document.getElementById('applyBtn');
const originalImg = document.getElementById('originalImg');
const filteredImg = document.getElementById('filteredImg');
const comparison = document.getElementById('comparison');
const emptyState = document.getElementById('emptyState');
const errorMsg = document.getElementById('errorMsg');
const infoBar = document.getElementById('infoBar');
const filterTagName = document.getElementById('filterTagName');
const downloadBtn = document.getElementById('downloadBtn');
const fileInfo = document.getElementById('fileInfo');
const uploadZone = document.getElementById('uploadZone');

function selectFilter(btn, key) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedFilter = key;
  filterTagName.textContent = btn.textContent.trim();
}

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.classList.add('visible');
}

function hideError() {
  errorMsg.classList.remove('visible');
}

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  loadFile(file);
});

uploadZone.addEventListener('dragover', e => {
  e.preventDefault();
  uploadZone.classList.add('drag-over');
});

uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));

uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadFile(file);
});

function loadFile(file) {
  currentFile = file;
  hideError();
  applyBtn.disabled = false;
  emptyState.style.display = 'none';

  const reader = new FileReader();
  reader.onload = ev => {
    originalImg.src = ev.target.result;
    filteredImg.src = '';
    comparison.classList.add('visible');
    infoBar.classList.add('visible');
    fileInfo.textContent = file.name + ' · ' + (file.size / 1024).toFixed(0) + ' KB';
  };
  reader.readAsDataURL(file);
}

async function applyFilter() {
  if (!currentFile) return;
  hideError();

  applyBtn.classList.add('loading');
  applyBtn.disabled = true;

  const formData = new FormData();
  formData.append('image', currentFile);
  formData.append('filter', selectedFilter);

  try {
    const res = await fetch('/apply', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.error) {
      showError(data.error);
    } else {
      filteredImg.src = data.image;
      downloadBtn.href = data.image;
    }
  } catch (err) {
    showError('Something went wrong. Is the server running?');
  } finally {
    applyBtn.classList.remove('loading');
    applyBtn.disabled = false;
  }
}
</script>
</body>
</html>
